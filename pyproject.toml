[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-meeting-booklet"
version = "0.1.36"
description = "学校运动会秩序册与决赛编排系统"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "PySide6-Essentials==6.8.3",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyinstaller>=6.0"]

[project.scripts]
sport-meeting = "sport_meeting.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
